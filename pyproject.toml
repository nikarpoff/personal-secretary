[project]
name = "personal-assistant"
version = "1.0.0"
description = "Бэкенд ИИ-секретаря: Google Calendar, заметки Obsidian и напоминания в Telegram для OpenClaw"
authors = [
    {name = "Nikita Karpov", email = "91084477+nikarpoff@users.noreply.github.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
  # --- API --------------------------------------------------------
  "fastapi[standard]>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.0",
  "pydantic-settings>=2.10.0",
  "loguru>=0.7.3",
  "mcp>=2.3.0,<3.0.0",

  # --- Upstream ---------------------------------------------------
  "httpx>=0.28.1",
  "google-auth[requests]>=2.62.0,<3.0.0",

  # --- Core -------------------------------------------------------
  "tzdata>=2026.6",
  "PyYAML>=6.0.3,<7.0.0",
  "python-frontmatter>=1.3.0,<2.0.0",
  "markdown-it-py>=4.2.0,<5.0.0",
  "filelock>=4.2.7,<5.0.0",
]

[dependency-groups]
dev = [
  # One-time Google OAuth consent: scripts/authorize_google.py
  "google-auth-oauthlib>=1.5.0",
  "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
