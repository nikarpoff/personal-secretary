# Copy to data/webdav/private/webdav.yaml and replace credentials BEFORE enabling the profile.
# This template is public. The private config is outside the backend's secrets mount.
host: 0.0.0.0
port: 8080
server: cheroot
provider_mapping:
  /: /var/lib/dav
fs_dav_provider:
  follow_symlinks: false
http_authenticator:
  domain_controller: null
  accept_basic: true
  accept_digest: false
  default_to_digest: false
simple_dc:
  user_mapping:
    "*":
      secretary-sync:
        password: "REPLACE_WITH_A_LONG_UNIQUE_PASSWORD"
dir_browser:
  enable: false
# DAV locks are process-local; synchronization is not a distributed transaction.
lock_storage: true
property_manager: null
# Avoid logging every path in a private vault.
verbose: 2
