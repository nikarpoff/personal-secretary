services:
  personal-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-assistant
    env_file: .env
    volumes:
      - ./data/assistant:/data
      - ./secrets:/secrets:ro
    ports:
      # Только локально: OpenClaw ходит по внутренней сети compose
      - "127.0.0.1:8090:8000"
    extra_hosts:
      host.docker.internal: host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Разовый контейнер перед стартом шлюза:
  # 1. кладёт личность агента из openclaw/workspace (имя, характер, правила) и убирает ритуал
  #    первого запуска BOOTSTRAP.md - заполнить его сам агент не может, у него нет записи файлов;
  # 2. отдаёт data/openclaw пользователю node (uid 1000): отсутствующий каталог Docker создаёт от root
  openclaw-init:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /home/node/.openclaw/workspace
        cp /opt/personal-assistant/workspace/*.md /home/node/.openclaw/workspace/
        rm -f /home/node/.openclaw/workspace/BOOTSTRAP.md
        chown -R 1000:1000 /home/node/.openclaw
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./openclaw/workspace:/opt/personal-assistant/workspace:ro
    restart: "no"

  # Команды OpenClaw: scripts/openclaw.sh <команда>
  openclaw-gateway:
    container_name: openclaw-gateway
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    env_file: .env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./openclaw/whisper/transcribe.mjs:/opt/secretary/transcribe-whisper.mjs:ro
      - ./scripts/render_openclaw_config.mjs:/opt/personal-assistant/render-config.mjs:ro
      # Native workspace skill loading keeps read access within tools.fs.workspaceOnly.
      - ./openclaw/skills/secretary:/home/node/.openclaw/workspace/skills/secretary:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    extra_hosts:
      host.docker.internal: host-gateway
    ports:
      # Control UI: открывайте через SSH-туннель, наружу порт не публикуется
      - "127.0.0.1:18789:18789"
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
      personal-assistant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

