services:
  personal-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-assistant
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
      # Secretary is the assistant's scope; Personal stays outside the backend.
      - ./data/obsidian/Secretary:/notes
      - ./data/assistant-state:/assistant-state
    ports:
      # Только локально: OpenClaw ходит по внутренней сети compose
      - "127.0.0.1:8090:8000"
    extra_hosts:
      host.docker.internal: host-gateway
    restart: unless-stopped
    # Let an in-flight task delivery finish and persist its acknowledgement.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Разовый контейнер перед стартом шлюза:
  # 1. кладёт личность агента из openclaw/workspace (имя, характер, правила) и убирает ритуал
  #    первого запуска BOOTSTRAP.md - заполнить его сам агент не может, у него нет записи файлов;
  # 2. отдаёт data/openclaw пользователю node (uid 1000): отсутствующий каталог Docker создаёт от root
  openclaw-init:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /home/node/.openclaw/workspace
        cp /opt/personal-assistant/workspace/*.md /home/node/.openclaw/workspace/
        rm -f /home/node/.openclaw/workspace/BOOTSTRAP.md
        chown -R 1000:1000 /home/node/.openclaw
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./openclaw/workspace:/opt/personal-assistant/workspace:ro
    restart: "no"

  # Команды OpenClaw: scripts/openclaw.sh <команда>
  openclaw-gateway:
    container_name: openclaw-gateway
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    env_file: .env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./openclaw/whisper/transcribe.mjs:/opt/secretary/transcribe-whisper.mjs:ro
      - ./scripts/render_openclaw_config.mjs:/opt/personal-assistant/render-config.mjs:ro
      # Native workspace skill loading keeps read access within tools.fs.workspaceOnly.
      - ./openclaw/skills/secretary:/home/node/.openclaw/workspace/skills/secretary:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    extra_hosts:
      host.docker.internal: host-gateway
    ports:
      # Control UI: открывайте через SSH-туннель, наружу порт не публикуется
      - "127.0.0.1:18789:18789"
    depends_on:
      openclaw-init:
        condition: service_completed_successfully
      personal-assistant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional HTTPS WebDAV endpoint for Obsidian Remotely Save.
  # Configure the domain and secrets/webdav.env as described in docs/obsidian.md.
  obsidian-webdav:
    profiles: [obsidian-sync]
    build:
      context: ./deploy/webdav
    env_file:
      - path: ./secrets/webdav.env
        required: false
    environment:
      OBSIDIAN_VAULT_NAME: ${OBSIDIAN_VAULT_NAME:-Obsidian}
    volumes:
      - ./data/obsidian:/var/lib/dav
    expose:
      - "8080"
    networks: [obsidian-sync]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    # Host vault directories may belong to the deploy user.
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  obsidian-https:
    profiles: [obsidian-sync]
    image: caddy:2.10.2-alpine
    environment:
      # Must be a public hostname with DNS pointing at this VPS. Empty means fail closed.
      OBSIDIAN_SYNC_DOMAIN: ${OBSIDIAN_SYNC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/webdav/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/webdav/caddy-data:/data
      - ./data/webdav/caddy-config:/config
    networks: [obsidian-sync]
    depends_on:
      - obsidian-webdav
    restart: unless-stopped

networks:
  obsidian-sync:
    # WebDAV is reachable only by its TLS proxy; backend/OpenClaw use a different network.
    driver: bridge
