services:
  personal-assistant:
    # CI задаёт образ из GHCR и имена контейнеров в deploy.env; локально образ собирается из исходников
    image: ${PERSONAL_ASSISTANT_IMAGE:-personal-assistant:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PERSONAL_ASSISTANT_CONTAINER:-personal-assistant}
    env_file: .env
    volumes:
      - ./data/assistant:/data
      - ./secrets:/secrets:ro
    ports:
      # Только локально: OpenClaw ходит по внутренней сети compose
      - "127.0.0.1:${PERSONAL_ASSISTANT_PORT:-8090}:8000"
    extra_hosts:
      host.docker.internal: host-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Разовый контейнер перед стартом остальных:
  # 1. кладёт личность агента из openclaw/workspace и убирает ритуал первого запуска BOOTSTRAP.md -
  #    заполнить его сам агент не может, у него нет записи файлов;
  # 2. отдаёт каталоги OpenClaw, заметок, Basic Memory и Syncthing пользователю uid 1000,
  #    от которого они работают: отсутствующий каталог Docker создаёт от root
  data-init:
    image: ${OPENCLAW_IMAGE:-${OPENCLAW_RUNTIME_IMAGE:-personal-openclaw:2026.10.9-node26.12.1}}
    container_name: ${DATA_INIT_CONTAINER:-data-init}
    user: "0:0"
    entrypoint:
      - sh
      - -ec
      - |
        mkdir -p /data/openclaw/workspace /data/notes /data/basic-memory /data/syncthing
        cp /opt/personal-assistant/workspace/*.md /data/openclaw/workspace/
        rm -f /data/openclaw/workspace/BOOTSTRAP.md
        chown -R 1000:1000 /data/openclaw /data/notes /data/basic-memory /data/syncthing
    volumes:
      - ./data:/data
      - ./openclaw/workspace:/opt/personal-assistant/workspace:ro
    restart: "no"

  # Заметки: Markdown-хранилище Obsidian в data/notes, агент работает с ним через MCP Basic Memory.
  # У HTTP-транспорта нет авторизации: порт не публикуется, доступ только из сети compose
  basic-memory:
    image: ${BASIC_MEMORY_IMAGE:-ghcr.io/basicmachines-co/basic-memory:1.0.0}
    container_name: ${BASIC_MEMORY_CONTAINER:-basic-memory}
    command: ["basic-memory", "mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--project", "main"]
    # Только нужные ему переменные, а не весь .env: это сторонний контейнер
    environment:
      BASIC_MEMORY_HOME: /app/data
      # Эмбеддинги смыслового поиска - по OpenAI-совместимому API, локальной модели нет
      BASIC_MEMORY_SEMANTIC_EMBEDDING_PROVIDER: openai
      BASIC_MEMORY_SEMANTIC_EMBEDDING_API_BASE: ${EMBEDDING_BASE_URL}
      BASIC_MEMORY_SEMANTIC_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      BASIC_MEMORY_SEMANTIC_EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      BASIC_MEMORY_SEMANTIC_EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      BASIC_MEMORY_SEMANTIC_MIN_SIMILARITY: "0.3"
      BASIC_MEMORY_NO_PROMOS: "1"
      BASIC_MEMORY_AUTO_UPDATE: "false"
    volumes:
      - ./data/notes:/app/data
      - ./data/basic-memory:/home/appuser/.basic-memory
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Синхронизация data/notes с Obsidian на ваших устройствах
  syncthing:
    image: ${SYNCTHING_IMAGE:-syncthing/syncthing:2.1.7}
    container_name: ${SYNCTHING_CONTAINER:-syncthing}
    hostname: personal-assistant
    volumes:
      - ./data/syncthing:/var/syncthing
      - ./data/notes:/var/syncthing/notes
    ports:
      # Веб-интерфейс - через SSH-туннель
      - "127.0.0.1:${SYNCTHING_UI_PORT:-8384}:8384"
      # Прямые соединения с устройствами; без них Syncthing работает через публичные relay
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Команды OpenClaw: scripts/openclaw.sh <команда>
  openclaw-gateway:
    container_name: ${OPENCLAW_GATEWAY_CONTAINER:-openclaw-gateway}
    image: ${OPENCLAW_IMAGE:-${OPENCLAW_RUNTIME_IMAGE:-personal-openclaw:2026.10.9-node26.12.1}}
    # Штатный Dockerfile той же версии OpenClaw; зависимости собираются на Node 26 вместе с runtime.
    build:
      context: https://github.com/openclaw/openclaw.git#8b18b5578f66eab1501cba4cef2310d88bfb9a41
      args:
        GIT_COMMIT: 8b18b5578f66eab1501cba4cef2310d88bfb9a41
        OPENCLAW_DOCKER_BUILD_VERSION: 2026.10.9
        OPENCLAW_EXTENSIONS: diagnostics-otel,codex
        OPENCLAW_NODE_BOOKWORM_IMAGE: docker.io/library/node:26.12.1-bookworm@sha256:3b764117159bda01d2396391e7789b6a9106af9729cfd001ef55e98557868310
        OPENCLAW_NODE_BOOKWORM_SLIM_IMAGE: docker.io/library/node:26.12.1-bookworm-slim@sha256:88e480776c6149ff1d098cd304f44bf18057fb5d284a3329b78162d29821e28c
        OPENCLAW_NODE_BOOKWORM_SLIM_DIGEST: sha256:88e480776c6149ff1d098cd304f44bf18057fb5d284a3329b78162d29821e28c
      labels:
        org.opencontainers.image.base.name: docker.io/library/node:26.12.1-bookworm-slim
    env_file: .env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      # Навык из репозитория внутри рабочего каталога: read видит только его (tools.fs.workspaceOnly)
      - ./openclaw/skills/secretary:/home/node/.openclaw/workspace/skills/secretary:ro
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    extra_hosts:
      host.docker.internal: host-gateway
    ports:
      # Control UI: открывайте через SSH-туннель, наружу порт не публикуется
      - "127.0.0.1:${OPENCLAW_UI_PORT:-18789}:18789"
    depends_on:
      data-init:
        condition: service_completed_successfully
      personal-assistant:
        condition: service_healthy
      basic-memory:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # Тот же /healthz, что у штатной проверки, без запуска Node каждые 30 секунд
      test: ["CMD", "curl", "-fsS", "--noproxy", "*", "-o", "/dev/null", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      # На небольшом сервере шлюз стартует около минуты, а проверка под нагрузкой идёт дольше 5 секунд
      timeout: 15s
      retries: 5
      start_period: 120s
      start_interval: 5s
